services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fonolife_demo
      POSTGRES_USER: fonolife
      POSTGRES_PASSWORD: fonolife
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fonolife -d fonolife_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
  clamav:
    image: clamav/clamav:latest
    ports: ["3310:3310"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
  app:
    build: .
    environment:
      DATABASE_URL: postgres://fonolife:fonolife@db:5432/fonolife_demo
      PORT: 3000
      APP_ORIGIN: http://localhost:3000
      NODE_ENV: ${NODE_ENV:-development}
      APP_ENV: ${APP_ENV:-demo}
      DEMO_DATABASE_HOST: db
      DEMO_DATABASE_NAME: fonolife_demo
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
