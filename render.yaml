services:
  - type: web
    name: fonolife
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: ATTACHMENT_STORAGE_PROVIDER
        value: s3
      - key: ATTACHMENT_SCANNER_PROVIDER
        value: clamav
      - key: DATABASE_URL
        fromDatabase:
          name: fonolife-db
          property: connectionString
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
  - type: web
    name: fonolife-demo
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: fonolife-demo-db
          property: connectionString
      - key: DEMO_DATABASE_NAME
        value: fonolife_demo
      - key: DEMO_OPERATION_TOKEN
        generateValue: true
      - key: ATTACHMENT_STORAGE_PROVIDER
        value: demo
      - key: ATTACHMENT_SCANNER_PROVIDER
        value: mock

databases:
  - name: fonolife-db
    plan: free
    databaseName: fonolife
    user: fonolife
  - name: fonolife-demo-db
    plan: free
    databaseName: fonolife_demo
    user: fonolife_demo
